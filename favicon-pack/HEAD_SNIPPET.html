     FAVICONS CURREN LATAM

     Pega este bloque COMPLETO dentro del <head> de tu index.html,

<!-- Favicon clásico (compatibilidad universal) -->
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="shortcut icon" href="./favicon.ico">

<!-- Favicon vectorial escalable (mejor en pantallas Retina) -->
<link rel="icon" href="./favicon.svg" type="image/svg+xml">

<!-- Favicons PNG por tamaño -->
<link rel="icon" href="./favicon-16x16.png" sizes="16x16" type="image/png">
<link rel="icon" href="./favicon-32x32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./favicon-48x48.png" sizes="48x48" type="image/png">

<!-- Apple touch icon (iOS home screen) -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">

<!-- PWA manifest -->
<link rel="manifest" href="./manifest.webmanifest">

<!-- Theme color de la barra del navegador móvil (rojo CURREN) -->
<meta name="theme-color" content="#c90000">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
